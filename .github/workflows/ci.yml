name: fabric-ci
on: [push, pull_request]
jobs:
  validate-render-simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Validate intent
        run: python cli.py validate
      - name: Bad intent must be blocked
        run: |
          for f in scenarios/bad_*.yml; do
            if python cli.py validate --intent "$f"; then echo "::error::$f was not blocked"; exit 1; fi
          done
      - name: Render configs
        run: python cli.py render
      - name: Lab topology is in sync with intent
        run: python lab/gen_topology.py | diff - lab/topology.clab.yml
      - name: Simulated greenfield rollout
        run: python cli.py deploy --simulate
      - name: Idempotency (second run must change nothing)
        run: python cli.py plan | grep -q "^0 of 6 devices change"
      - name: Canary failure must halt and roll back
        run: |
          rm -rf state/simulated
          if python cli.py deploy --simulate --fail-on leaf3; then echo "::error::rollout did not halt"; exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: build-and-reports, path: "build/\nreports/"}
